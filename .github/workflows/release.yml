# Manual-trigger packaging: builds VST3 (+ AU on macOS) on all three platforms, packages a basic
# installer per platform (.pkg/.exe/.deb) alongside a raw zip, and publishes everything to a
# GitHub Release. No push/schedule trigger — it ONLY runs when you start it from the Actions tab
# or `gh workflow run release.yml`, so a release is never cut accidentally.
#
# macOS ships TWO builds: `macos` (native Apple Silicon, arm64) and `macos-intel` (x86_64, cross-
# compiled on the same Apple Silicon runner via -DCMAKE_OSX_ARCHITECTURES=x86_64 rather than on
# GitHub's near-retired macos-13 Intel-hosted pool — method verified working on
# tehguitarist/Tommy). Both are signed/notarized identically; the Intel job's filenames carry an
# "-Intel" tag so the two never collide in the same Release.
#
# macOS artifacts are signed with a Developer ID Application certificate and notarized via
# notarytool, using secrets configured in the repo (APPLE_CERT_P12_BASE64, APPLE_CERT_PASSWORD,
# APPLE_SIGNING_IDENTITY, APPLE_TEAM_ID, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD).
#
# The macOS .pkg installer is built from installer/macos/ and wraps the (signed/notarized) AU/VST3
# bundles with a choice screen — both formats selected by default. The .pkg itself is also signed
# (productsign, a separate "Developer ID Installer" cert from the Application one used on the
# bundles — APPLE_INSTALLER_CERT_P12_BASE64, APPLE_INSTALLER_CERT_PASSWORD,
# APPLE_INSTALLER_SIGNING_IDENTITY) and notarized/stapled by the "Sign + notarize installer" step,
# so it shows no Gatekeeper warning on double-click either. The Windows .exe (NSIS) and Linux .deb
# are VST3-only since neither platform has AU.
name: Release

on:
  workflow_dispatch:
    inputs:
      draft:
        description: "Create as a draft release (review before publishing)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  version:
    name: Read version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - id: read
        run: |
          VERSION=$(grep -oP '(?<=project\(EchoPre3 VERSION )[0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt)
          echo "Read version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  macos:
    name: macOS build
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with: { submodules: recursive }

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build AU + VST3
        run: cmake --build build --config Release --target EchoPre3_AU --target EchoPre3_VST3 --parallel

      - name: Import signing certificates
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_INSTALLER_CERT_P12_BASE64: ${{ secrets.APPLE_INSTALLER_CERT_P12_BASE64 }}
          APPLE_INSTALLER_CERT_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          INSTALLER_CERT_PATH="$RUNNER_TEMP/installer-cert.p12"

          echo "$APPLE_CERT_P12_BASE64" | base64 --decode -o "$CERT_PATH"
          echo "$APPLE_INSTALLER_CERT_P12_BASE64" | base64 --decode -o "$INSTALLER_CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          security import "$INSTALLER_CERT_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_INSTALLER_CERT_PASSWORD" -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple:,codesign:,productsign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')

          rm -f "$CERT_PATH" "$INSTALLER_CERT_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Sign AU + VST3
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          for bundle in \
            "build/EchoPre3_artefacts/Release/AU/Echo Pre 3.component" \
            "build/EchoPre3_artefacts/Release/VST3/Echo Pre 3.vst3"; do
            codesign --force --deep --options runtime --timestamp \
              --sign "$APPLE_SIGNING_IDENTITY" --keychain "$KEYCHAIN_PATH" "$bundle"
            codesign --verify --deep --strict --verbose=2 "$bundle"
          done

      - name: Notarize AU + VST3
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          NOTARIZE_ZIP="$RUNNER_TEMP/notarize.zip"
          NOTARIZE_DIR="$RUNNER_TEMP/notarize"
          mkdir -p "$NOTARIZE_DIR"
          cp -R "build/EchoPre3_artefacts/Release/AU/Echo Pre 3.component" "$NOTARIZE_DIR/"
          cp -R "build/EchoPre3_artefacts/Release/VST3/Echo Pre 3.vst3" "$NOTARIZE_DIR/"
          ditto -c -k --keepParent "$NOTARIZE_DIR" "$NOTARIZE_ZIP"

          xcrun notarytool submit "$NOTARIZE_ZIP" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

          xcrun stapler staple "build/EchoPre3_artefacts/Release/AU/Echo Pre 3.component"
          xcrun stapler staple "build/EchoPre3_artefacts/Release/VST3/Echo Pre 3.vst3"

      - name: Package
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          # Zip only the AU/VST3 bundles, NOT the whole Release dir — that also contains
          # "libEcho Pre 3_SharedCode.a" (a build byproduct, not something an end user installs).
          # ditto -c can't take multiple sources directly, so stage them into one dir first
          # (named "Echo Pre 3" so --keepParent gives the zip a clean top-level folder).
          PKG_DIR="$RUNNER_TEMP/Echo Pre 3"
          mkdir -p "$PKG_DIR"
          cp -R "build/EchoPre3_artefacts/Release/AU" "build/EchoPre3_artefacts/Release/VST3" "$PKG_DIR/"
          ditto -c -k --sequesterRsrc --keepParent "$PKG_DIR" "EchoPre3-macOS-v${VERSION}.zip"

      - name: Build installer
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          installer/macos/build_installer.sh "$VERSION" build/EchoPre3_artefacts/Release .

      - name: Sign + notarize installer
        env:
          APPLE_INSTALLER_SIGNING_IDENTITY: ${{ secrets.APPLE_INSTALLER_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          PKG="EchoPre3-macOS-v${VERSION}-Installer.pkg"
          SIGNED_PKG="$RUNNER_TEMP/signed.pkg"

          productsign --sign "$APPLE_INSTALLER_SIGNING_IDENTITY" --keychain "$KEYCHAIN_PATH" \
            "$PKG" "$SIGNED_PKG"
          mv "$SIGNED_PKG" "$PKG"

          xcrun notarytool submit "$PKG" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

          xcrun stapler staple "$PKG"

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN_PATH" || true

      - uses: actions/upload-artifact@v6
        with:
          name: EchoPre3-macOS
          path: |
            EchoPre3-macOS-v*.zip
            EchoPre3-macOS-v*.pkg

  macos-intel:
    name: macOS build (Intel)
    needs: version
    # GitHub's macos-13 (Intel-hosted) runner pool has become unreliable/near-retired — jobs can
    # sit in "waiting for a runner" indefinitely. Build the Intel slice by CROSS-COMPILING on the
    # Apple Silicon runner instead (Xcode's clang + the macOS SDK support this natively via
    # -DCMAKE_OSX_ARCHITECTURES=x86_64 below) — no Intel hardware needed, and it's not subject to
    # that pool's availability. (Method verified working on tehguitarist/Tommy.)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with: { submodules: recursive }

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=x86_64

      - name: Build AU + VST3
        run: cmake --build build --config Release --target EchoPre3_AU --target EchoPre3_VST3 --parallel

      - name: Import signing certificates
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_INSTALLER_CERT_P12_BASE64: ${{ secrets.APPLE_INSTALLER_CERT_P12_BASE64 }}
          APPLE_INSTALLER_CERT_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          INSTALLER_CERT_PATH="$RUNNER_TEMP/installer-cert.p12"

          echo "$APPLE_CERT_P12_BASE64" | base64 --decode -o "$CERT_PATH"
          echo "$APPLE_INSTALLER_CERT_P12_BASE64" | base64 --decode -o "$INSTALLER_CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          security import "$INSTALLER_CERT_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_INSTALLER_CERT_PASSWORD" -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple:,codesign:,productsign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')

          rm -f "$CERT_PATH" "$INSTALLER_CERT_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Sign AU + VST3
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          for bundle in \
            "build/EchoPre3_artefacts/Release/AU/Echo Pre 3.component" \
            "build/EchoPre3_artefacts/Release/VST3/Echo Pre 3.vst3"; do
            codesign --force --deep --options runtime --timestamp \
              --sign "$APPLE_SIGNING_IDENTITY" --keychain "$KEYCHAIN_PATH" "$bundle"
            codesign --verify --deep --strict --verbose=2 "$bundle"
          done

      - name: Notarize AU + VST3
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          NOTARIZE_ZIP="$RUNNER_TEMP/notarize.zip"
          NOTARIZE_DIR="$RUNNER_TEMP/notarize"
          mkdir -p "$NOTARIZE_DIR"
          cp -R "build/EchoPre3_artefacts/Release/AU/Echo Pre 3.component" "$NOTARIZE_DIR/"
          cp -R "build/EchoPre3_artefacts/Release/VST3/Echo Pre 3.vst3" "$NOTARIZE_DIR/"
          ditto -c -k --keepParent "$NOTARIZE_DIR" "$NOTARIZE_ZIP"

          xcrun notarytool submit "$NOTARIZE_ZIP" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

          xcrun stapler staple "build/EchoPre3_artefacts/Release/AU/Echo Pre 3.component"
          xcrun stapler staple "build/EchoPre3_artefacts/Release/VST3/Echo Pre 3.vst3"

      - name: Package
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          # Zip only the AU/VST3 bundles, NOT the whole Release dir — see the ARM job's comment.
          # Filenames carry an "Intel" tag so this job's assets never collide with the ARM job's
          # when both land in the same GitHub Release.
          PKG_DIR="$RUNNER_TEMP/Echo Pre 3"
          mkdir -p "$PKG_DIR"
          cp -R "build/EchoPre3_artefacts/Release/AU" "build/EchoPre3_artefacts/Release/VST3" "$PKG_DIR/"
          ditto -c -k --sequesterRsrc --keepParent "$PKG_DIR" "EchoPre3-macOS-Intel-v${VERSION}.zip"

      - name: Build installer
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          installer/macos/build_installer.sh "$VERSION" build/EchoPre3_artefacts/Release .
          # build_installer.sh always names its output "EchoPre3-macOS-v<version>-Installer.pkg" —
          # rename it so this Intel build's asset doesn't collide with the ARM job's.
          mv "EchoPre3-macOS-v${VERSION}-Installer.pkg" "EchoPre3-macOS-Intel-v${VERSION}-Installer.pkg"

      - name: Sign + notarize installer
        env:
          APPLE_INSTALLER_SIGNING_IDENTITY: ${{ secrets.APPLE_INSTALLER_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          PKG="EchoPre3-macOS-Intel-v${VERSION}-Installer.pkg"
          SIGNED_PKG="$RUNNER_TEMP/signed.pkg"

          productsign --sign "$APPLE_INSTALLER_SIGNING_IDENTITY" --keychain "$KEYCHAIN_PATH" \
            "$PKG" "$SIGNED_PKG"
          mv "$SIGNED_PKG" "$PKG"

          xcrun notarytool submit "$PKG" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

          xcrun stapler staple "$PKG"

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN_PATH" || true

      - uses: actions/upload-artifact@v6
        with:
          name: EchoPre3-macOS-Intel
          path: |
            EchoPre3-macOS-Intel-v*.zip
            EchoPre3-macOS-Intel-v*.pkg

  windows:
    name: Windows build
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with: { submodules: recursive }

      - name: Configure
        run: cmake -B build

      - name: Build VST3
        run: cmake --build build --config Release --target EchoPre3_VST3 --parallel

      - name: Package
        shell: pwsh
        run: |
          $version = "${{ needs.version.outputs.version }}"
          Compress-Archive -Path "build/EchoPre3_artefacts/Release/VST3/Echo Pre 3.vst3" `
            -DestinationPath "EchoPre3-Windows-v$version.zip"

      # makensis ships on windows-latest runners but is NOT on PATH — locate it rather than
      # assume a bare `makensis` call works (it doesn't).
      - name: Build installer
        shell: pwsh
        run: |
          $version = "${{ needs.version.outputs.version }}"

          $makensis = Get-Command makensis.exe -ErrorAction SilentlyContinue
          if ($makensis) {
            $makensisPath = $makensis.Source
          } else {
            $candidates = @(
              "$env:ProgramFiles\NSIS\makensis.exe",
              "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
            )
            $makensisPath = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }

          if (-not $makensisPath) {
            Write-Host "makensis not found on this runner — installing via Chocolatey"
            choco install nsis -y --no-progress
            $makensisPath = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          }

          Write-Host "Using makensis at $makensisPath"
          & $makensisPath /DVERSION=$version /DARTEFACTS_DIR="$PWD\build\EchoPre3_artefacts\Release\VST3" installer\windows\EchoPre3.nsi

          # NSIS resolves a relative OutFile against the .nsi's own directory, not this process's
          # CWD — move the built installer to the repo root so the upload-artifact glob finds it.
          Move-Item "installer\windows\EchoPre3-Windows-v$version-Installer.exe" .

      - uses: actions/upload-artifact@v6
        with:
          name: EchoPre3-Windows
          path: |
            EchoPre3-Windows-v*.zip
            EchoPre3-Windows-v*.exe

  linux:
    name: Linux build
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { submodules: recursive }

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libjack-jackd2-dev ladspa-sdk libcurl4-openssl-dev \
            libfreetype6-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libwebkit2gtk-4.1-dev \
            libglu1-mesa-dev mesa-common-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3
        run: cmake --build build --config Release --target EchoPre3_VST3 --parallel

      - name: Package
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          (cd build/EchoPre3_artefacts/Release/VST3 && \
            zip -r "${GITHUB_WORKSPACE}/EchoPre3-Linux-v${VERSION}.zip" "Echo Pre 3.vst3")

      - name: Build installer
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          installer/linux/build_deb.sh "$VERSION" build/EchoPre3_artefacts/Release .

      - uses: actions/upload-artifact@v6
        with:
          name: EchoPre3-Linux
          path: |
            EchoPre3-Linux-v*.zip
            EchoPre3-Linux-v*.deb

  publish:
    name: Publish release
    needs: [version, macos, macos-intel, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with: { path: artifacts }
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: Echo Pre 3 v${{ needs.version.outputs.version }}
          draft: ${{ inputs.draft }}
          files: |
            artifacts/**/*.zip
            artifacts/**/*.pkg
            artifacts/**/*.exe
            artifacts/**/*.deb
