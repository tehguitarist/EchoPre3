# Build + test CI for Echo Pre 3 (AU/VST3, JUCE 8+, chowdsp_wdf).
name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libjack-jackd2-dev ladspa-sdk libcurl4-openssl-dev \
            libfreetype6-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libwebkit2gtk-4.1-dev \
            libglu1-mesa-dev mesa-common-dev xvfb

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        # Unbounded --parallel lets make/ninja fan out one job per available core, but this
        # project links ~9 separate juce_add_console_app/test targets that each independently
        # recompile the heavy JUCE GUI/audio-device modules from source (JUCE's CMake helpers
        # don't share object files across targets). On macOS (3 vCPU/14GB) that many concurrent
        # .mm compiles exhausts RAM and the build appears to hang (it's actually thrashing, not
        # deadlocked). On Linux (4 vCPU/16GB) the disk-usage trace we added to debug repeated
        # mid-build "shutdown signal" kills ruled out disk (steady 86GB free throughout) and the
        # log showed the real cause: "c++: fatal error: Killed signal terminated program cc1plus"
        # -- the kernel OOM killer, on a heavy juce_gui_basics/.mm-adjacent translation unit.
        # Windows hasn't shown either problem. Cap both to values already verified working on
        # tehguitarist/Tommy, which hit the identical Linux OOM at unbounded parallelism.
        run: cmake --build build --config Release --parallel ${{ (runner.os == 'macOS' && 3) || (runner.os == 'Linux' && 2) || '' }}

      - name: Run tests (Linux, headless display)
        if: runner.os == 'Linux'
        run: xvfb-run -a ctest --test-dir build -C Release --output-on-failure --timeout 300

      - name: Run tests
        if: runner.os != 'Linux'
        run: ctest --test-dir build -C Release --output-on-failure --timeout 300

      - name: Validate AU (auval)
        if: runner.os == 'macOS'
        run: |
          # On a clean CI runner the freshly-copied .component isn't registered with the
          # AudioComponentRegistrar yet, so auval reports "didn't find the component" / -50.
          # Bounce the registrar so it rescans ~/Library/Audio/Plug-Ins/Components and retry.
          ls -la "$HOME/Library/Audio/Plug-Ins/Components/" || true
          ok=0
          for i in 1 2 3 4; do
            if auval -v aufx Ep3p Lprc; then ok=1; break; fi
            echo "::warning::auval attempt $i failed; bouncing AudioComponentRegistrar and retrying"
            killall -9 AudioComponentRegistrar 2>/dev/null || true
            sleep 5
          done
          [ "$ok" = 1 ]
