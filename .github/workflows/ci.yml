# Build + test CI for Echo Pre 3 (AU/VST3, JUCE 8+, chowdsp_wdf).
name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libjack-jackd2-dev ladspa-sdk libcurl4-openssl-dev \
            libfreetype6-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libwebkit2gtk-4.1-dev \
            libglu1-mesa-dev mesa-common-dev xvfb

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        if: runner.os != 'Linux'
        # Unbounded --parallel lets make/ninja fan out one job per available core, but this
        # project links ~6 separate juce_add_console_app targets that each independently
        # recompile the heavy JUCE GUI/audio-device modules from source (JUCE's CMake helpers
        # don't share object files across targets) -- on the 3-vCPU/14GB macOS runner that many
        # concurrent .mm compiles exhausts RAM and the build appears to hang (it's actually
        # thrashing, not deadlocked). Cap macOS explicitly; Windows hasn't shown this.
        run: cmake --build build --config Release --parallel ${{ runner.os == 'macOS' && 3 || '' }}

      - name: Build (Linux, with disk-usage trace)
        if: runner.os == 'Linux'
        # Twice now the ubuntu build has died ~2 min after linking vst3_helper with the generic
        # "runner has received a shutdown signal" / exit 143 -- no compiler error, same spot both
        # times. That's not a code problem and doesn't match the concurrency cancellation we've
        # seen elsewhere (no newer push existed either time). It matches GitHub's own low-disk-space
        # auto-cancellation on hosted runners: this build links ~9 separate targets that each
        # independently recompile full JUCE modules from source, which can add up. Log free space
        # every 15s during the build so the NEXT failure (if it recurs) shows whether disk was the
        # cause instead of us having to guess again.
        run: |
          ( while true; do echo "[disk] $(date -u +%H:%M:%S) $(df -h / | tail -n1)"; sleep 15; done ) &
          monitor_pid=$!
          trap 'kill "$monitor_pid" 2>/dev/null || true' EXIT
          cmake --build build --config Release --parallel

      - name: Run tests (Linux, headless display)
        if: runner.os == 'Linux'
        run: xvfb-run -a ctest --test-dir build -C Release --output-on-failure --timeout 300

      - name: Run tests
        if: runner.os != 'Linux'
        run: ctest --test-dir build -C Release --output-on-failure --timeout 300

      - name: Validate AU (auval)
        if: runner.os == 'macOS'
        run: |
          # On a clean CI runner the freshly-copied .component isn't registered with the
          # AudioComponentRegistrar yet, so auval reports "didn't find the component" / -50.
          # Bounce the registrar so it rescans ~/Library/Audio/Plug-Ins/Components and retry.
          ls -la "$HOME/Library/Audio/Plug-Ins/Components/" || true
          ok=0
          for i in 1 2 3 4; do
            if auval -v aufx Ep3p Lprc; then ok=1; break; fi
            echo "::warning::auval attempt $i failed; bouncing AudioComponentRegistrar and retrying"
            killall -9 AudioComponentRegistrar 2>/dev/null || true
            sleep 5
          done
          [ "$ok" = 1 ]
